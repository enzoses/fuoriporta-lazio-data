name: Sync Lazio Open Data

on:
  schedule:
    # Esegue ogni 6 ore (00:15, 06:15, 12:15, 18:15 UTC)
    - cron: '15 */6 * * *'
  workflow_dispatch: # Avvio manuale con 1 click dal tab Actions di GitHub

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Open Data ETL Script
        run: python3 build_datasets.py

      - name: Commit & Push updated JSON datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dataset."
          else
            git commit -m "chore(data): auto-sync Lazio Open Data [skip ci]"
            git push
          fi
